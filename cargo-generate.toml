[template]

[placeholders.repo-url]
type = "string"
prompt = "GitHub HTTPS 地址（用于 changelog/deny 链接，例如 https://github.com/username/repo）"

[placeholders.edition]
type = "string"
prompt = "Rust edition 版本"
default = "2024"
choices = ["2021", "2024"]

[placeholders.author]
type = "string"
prompt = "作者名称"

[placeholders.email]
type = "string"
prompt = "作者邮箱"

[placeholders.description]
type = "string"
prompt = "项目描述"
